<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z.ai Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    
    #chat { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; max-width: 80%; white-space: pre-wrap; word-break: break-word; }
    .user { background: #1a3a1a; margin-left: auto; }
    .assistant { background: #1a1a2e; }
    .error { background: #3a1a1a; color: #ff8888; }

    #input-area { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #222; }
    #input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #111; color: #e0e0e0; font-size: 14px; outline: none; }
    #input:focus { border-color: #444; }
    #send { padding: 10px 20px; border-radius: 6px; border: none; background: #2a2a4e; color: #e0e0e0; cursor: pointer; font-size: 14px; }
    #send:hover { background: #3a3a6e; }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="chat"></div>

  <div id="input-area">
    <input id="input" type="text" placeholder="Type a message..." autofocus />
    <button id="send">Send</button>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    // Conversation history — sent to API each request
    let messages = [];

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function setLoading(on) {
      sendBtn.disabled = on;
      sendBtn.textContent = on ? '...' : 'Send';
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      messages.push({ role: 'user', content: text });
      addMessage('user', text);
      setLoading(true);

      try {
        console.log('[z.ai] Sending:', JSON.stringify({ messages }));

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();
        console.log('[z.ai] Response:', JSON.stringify(data));

        if (!res.ok) {
          const errMsg = data?.error?.message || data?.msg || JSON.stringify(data);
          console.error('[z.ai] HTTP', res.status, errMsg);
          addMessage('error', `Error ${res.status}: ${errMsg}`);
          // Remove the failed user message from history so they can retry
          messages.pop();
        } else {
          const reply = data.choices?.[0]?.message?.content || '(empty reply)';
          messages.push({ role: 'assistant', content: reply });
          addMessage('assistant', reply);
        }
      } catch (err) {
        console.error('[z.ai] Fetch error:', err);
        addMessage('error', `Network error: ${err.message}`);
        messages.pop();
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
